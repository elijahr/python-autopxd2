# yamllint disable rule:line-length

name: Publish to PyPI

# yamllint disable rule:truthy
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      git-ref:
        description: 'Git ref to publish (tag or commit SHA)'
        required: true
# yamllint enable rule:truthy

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  pre-commit:
    uses: ./.github/workflows/pre-commit.yml

  docker:
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write

  build:
    name: Build distribution
    needs: [test, pre-commit, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.git-ref || github.ref }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify version matches tag
        env:
          REF_NAME: ${{ github.event.inputs.git-ref || github.event.release.tag_name || github.ref_name }}
        run: |
          case "$REF_NAME" in
            v*)
              EXPECTED="${REF_NAME#v}"
              VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
              if [ "$VERSION" != "$EXPECTED" ]; then
                echo "::error::Version mismatch: tag=$EXPECTED, pyproject.toml=$VERSION"
                exit 1
              fi
              echo "Verified version matches tag: $VERSION"
              ;;
            *)
              echo "Non-tag ref ($REF_NAME); skipping tag version match check"
              ;;
          esac

      - name: Install build dependencies
        run: uv pip install --system build

      - name: Build sdist and wheel
        run: python -m build

      - name: Install verification tools
        run: uv pip install --system check-manifest==0.51 twine==6.2.0

      - name: Verify sdist completeness
        run: check-manifest --verbose

      - name: Validate distribution metadata
        run: twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/autopxd2
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          print-hash: true

  github-release:
    name: Create GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.git-ref || github.event.release.tag_name || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" --generate-notes
          fi
