# yamllint disable rule:line-length

name: Test

on: [push, pull_request]

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor of requires-python, plus the current and next releases.
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.14'
          # windows-latest ships LLVM/clang preinstalled, so it runs both backends.
          - os: windows-latest
            python-version: '3.14'

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libclang (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev llvm
          # headerkit's vendored clang bindings dlopen libclang, so its directory
          # must be on the loader path.
          LLVM_LIB_DIR=$(llvm-config --libdir 2>/dev/null || echo "/usr/lib/llvm-14/lib")
          echo "LD_LIBRARY_PATH=${LLVM_LIB_DIR}:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "libclang lib dir: $LLVM_LIB_DIR"

      - name: Install test libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo ./scripts/install-test-libs-linux.sh

      - name: Install libclang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@19
          LLVM_PREFIX=$(brew --prefix llvm@19)
          # headerkit's vendored clang bindings dlopen libclang, so its directory
          # must be on the loader path.
          echo "DYLD_LIBRARY_PATH=${LLVM_PREFIX}/lib:${DYLD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "libclang prefix: $LLVM_PREFIX"

      - name: Install test libraries (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/install-test-libs-macos.sh

      - name: Verify LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # windows-latest preinstalls LLVM; verify rather than install it.
          clang --version
          which clang || true
          ls -1 "/c/Program Files/LLVM/bin" | grep -i libclang || true

      - name: Install dependencies
        run: uv pip install --system -e '.[test,treesitter]'

      - name: Verify libclang loads (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # A clang.exe on PATH does not prove libclang.dll can be dlopen'd,
          # which is what headerkit's vendored bindings actually need.
          if python -c "import sys; from headerkit.backends import is_backend_available; sys.exit(0 if is_backend_available('libclang') else 1)"; then
            echo "libclang backend available"
          else
            echo "Preinstalled LLVM is not loadable; falling back to headerkit.install_libclang"
            python -m headerkit.install_libclang
            python -c "import sys; from headerkit.backends import is_backend_available; sys.exit(0 if is_backend_available('libclang') else 1)"
            echo "libclang backend available after install_libclang"
          fi

      - name: Install numpy for test headers (Linux/macOS)
        if: runner.os != 'Windows'
        run: uv pip install --system numpy

      - name: Test (require all libraries)
        if: runner.os != 'Windows'
        run: pytest ./test --require-all-libraries

      # No install-test-libs script exists for Windows, so the real-header tests
      # skip on missing system libraries instead of failing. Everything else,
      # both backends included, runs in full.
      - name: Test (real-header tests skip on missing libraries)
        if: runner.os == 'Windows'
        run: pytest ./test
