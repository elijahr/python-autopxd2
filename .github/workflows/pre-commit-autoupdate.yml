name: Pre-commit Autoupdate

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  autoupdate:
    name: Update pre-commit hooks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: uv pip install --system pre-commit

      - name: Run pre-commit autoupdate
        run: pre-commit autoupdate

      # PRs opened with the default GITHUB_TOKEN do not trigger workflows, so the
      # updated hooks are exercised here or not at all.
      - name: Run updated hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          commit-message: 'Update pre-commit hooks'
          title: 'Update pre-commit hooks'
          body: |
            Automated update of pre-commit hook versions via `pre-commit autoupdate`.
          branch: chore/pre-commit-autoupdate
