name: Pre-commit Autoupdate

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  autoupdate:
    name: Update pre-commit hooks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: uv pip install --system pre-commit

      - name: Run pre-commit autoupdate
        run: pre-commit autoupdate

      # PRs opened with the default GITHUB_TOKEN do not trigger workflows, so the
      # updated hooks are exercised here or not at all.
      - name: Run updated hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Create pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8  # v8.1.2
        with:
          commit-message: 'Update pre-commit hooks'
          title: 'Update pre-commit hooks'
          body: |
            Automated update of pre-commit hook versions via `pre-commit autoupdate`.
          branch: chore/pre-commit-autoupdate
